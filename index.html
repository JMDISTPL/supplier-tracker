<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Supplier Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --border: #2e3348;
    --text: #e4e6f0; --text2: #9498b0; --accent: #6366f1; --accent-hover: #818cf8;
    --green: #22c55e; --yellow: #eab308; --orange: #f97316; --blue: #3b82f6; --red: #ef4444;
    --radius: 10px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  header h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  header .subtitle { font-size: 13px; color: var(--text2); }
  .controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .search-wrap { flex: 1; min-width: 200px; position: relative; display: flex; align-items: center; }
  .search-icon {
    position: absolute; left: 12px; font-size: 14px; opacity: .5; pointer-events: none;
  }
  .search-wrap input {
    width: 100%; padding: 9px 14px 9px 36px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface2); color: var(--text); font-size: 14px; outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .btn-primary {
    padding: 9px 18px; background: var(--accent); color: white; border: none;
    border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-sm {
    padding: 4px 10px; font-size: 12px; border-radius: 6px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text2); cursor: pointer;
  }
  .btn-sm:hover { color: var(--text); border-color: var(--text2); }

  /* Stats */
  .stats { display: flex; gap: 10px; padding: 16px 24px; flex-wrap: wrap; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 18px; min-width: 100px; flex: 1;
    cursor: pointer; transition: border-color .15s;
  }
  .stat-card:hover { border-color: var(--text2); }
  .stat-card.active { border-color: var(--accent); }
  .stat-card .num { font-size: 22px; font-weight: 700; }
  .stat-card .label { font-size: 11px; color: var(--text2); margin-top: 1px; text-transform: uppercase; letter-spacing: .5px; }
  .stat-card.all .num { color: var(--text); }
  .stat-card.prospects .num { color: var(--yellow); }
  .stat-card.contacted .num { color: var(--blue); }
  .stat-card.negotiating .num { color: var(--orange); }
  .stat-card.sampling .num { color: var(--accent); }
  .stat-card.partners .num { color: var(--green); }

  /* Kanban Board */
  .board {
    display: flex; gap: 12px; padding: 0 24px 24px;
    flex: 1; overflow-x: auto; min-height: 0;
  }
  .column {
    flex: 1; min-width: 220px; max-width: 300px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); display: flex; flex-direction: column;
    max-height: calc(100vh - 200px);
  }
  .column-header {
    padding: 12px 14px; font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .5px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  .column-header .count {
    background: var(--surface2); padding: 2px 8px;
    border-radius: 10px; font-size: 12px; font-weight: 500;
  }
  .column-body {
    padding: 8px; overflow-y: auto; flex: 1;
    min-height: 60px;
    transition: background .15s;
  }
  .column-body.drag-over {
    background: var(--surface2);
  }
  .column.prospects .column-header { color: var(--yellow); }
  .column.contacted .column-header { color: var(--blue); }
  .column.negotiating .column-header { color: var(--orange); }
  .column.sampling .column-header { color: var(--accent); }
  .column.partners .column-header { color: var(--green); }

  /* Cards */
  .card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 6px;
    cursor: grab; transition: all .15s; position: relative;
  }
  .card:active { cursor: grabbing; }
  .card:hover { border-color: var(--text2); }
  .card.dragging {
    opacity: .5; transform: rotate(2deg);
  }
  .card .card-company {
    font-weight: 600; font-size: 13px; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .card-notes {
    font-size: 11px; color: var(--text2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; line-height: 1.4;
  }
  .card .card-link {
    display: inline-block; font-size: 11px; color: var(--accent);
    text-decoration: none; margin-top: 4px;
  }
  .card .card-link:hover { text-decoration: underline; }
  .card .card-actions {
    position: absolute; top: 6px; right: 6px; display: none; gap: 2px;
  }
  .card:hover .card-actions { display: flex; }
  .card .card-actions button {
    background: none; border: none; color: var(--text2); cursor: pointer;
    font-size: 13px; padding: 2px 4px; border-radius: 4px;
  }
  .card .card-actions button:hover { background: var(--surface); color: var(--text); }
  .card .card-actions .del-btn:hover { color: var(--red); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 28px;
  }
  .modal h2 { font-size: 18px; margin-bottom: 20px; }
  .modal .close-btn { float: right; background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; }
  .modal .close-btn:hover { color: var(--text); }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 5px; font-weight: 500; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface2); color: var(--text); font-size: 14px; outline: none; font-family: inherit;
  }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .form-actions .btn-secondary {
    padding: 9px 18px; border: 1px solid var(--border); border-radius: 8px;
    background: transparent; color: var(--text2); cursor: pointer; font-size: 14px;
  }
  .form-actions .btn-secondary:hover { color: var(--text); border-color: var(--text2); }
  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 20px;
    font-size: 14px; color: var(--green); z-index: 200;
  }
  .loading { text-align: center; padding: 40px; color: var(--text2); }
  .spinner {
    display: inline-block; width: 32px; height: 32px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    .board { flex-direction: column; overflow-y: auto; }
    .column { max-width: none; min-width: 0; max-height: none; }
    .column-body { max-height: 200px; }
    header { padding: 12px 16px; }
    .controls { padding: 12px 16px; }
    .stats { padding: 12px 16px; gap: 6px; }
    .stat-card { padding: 8px 12px; min-width: auto; }
    .stat-card .num { font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>📦 JMPL Logistics</h1>
    <div class="subtitle">Drag &amp; drop to update status</div>
  </div>
  <button class="btn-primary" onclick="openAddModal()">+ Add Supplier</button>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Filter suppliers..." oninput="render()" />
  </div>
</div>

<div class="stats" id="stats"></div>

<div class="board" id="board"></div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">&cross;</button>
    <h2 id="modalTitle">+ Add Supplier</h2>
    <input type="hidden" id="editId" />
    <div class="form-group">
      <label>Company Name *</label>
      <input type="text" id="fCompany" placeholder="e.g. Yiwu Lucky Star Crafts" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Storefront Link</label>
        <input type="text" id="fStorefront" placeholder="Alibaba URL" />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="fStatus">
          <option value="Prospects">Prospects</option>
          <option value="Contacted">Contacted</option>
          <option value="Negotiating">Negotiating</option>
          <option value="Sampling">Sampling</option>
          <option value="Partners">Partners</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="fEmail" placeholder="supplier@example.com" />
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="fNotes" placeholder="Products, MOQ, pricing, business type, etc."></textarea>
    </div>
    <div class="form-group">
      <label><input type="checkbox" id="fVerified" /> Verified Pro supplier</label>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveSupplier()">Save</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://yybpjnxudjptlnuswskt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5YnBqbnh1ZGpwdGxudXN3c2t0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2OTA0OTksImV4cCI6MjA5NjI2NjQ5OX0.dOBkm1KT1X9xoXozd7yqpxfs9_8Tvv3E7RW-W-8opRQ';

async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json'
    }
  };
  if (body) {
    opts.headers['Prefer'] = 'return=representation';
    opts.body = JSON.stringify(body);
  }
  const resp = await fetch(SUPABASE_URL + path, opts);
  if (!resp.ok) throw new Error((await resp.text()).substring(0, 100));
  const ct = resp.headers.get('content-type') || '';
  if (ct.includes('json')) return resp.json();
  return null;
}

const STATUSES = ['Prospects', 'Contacted', 'Negotiating', 'Sampling', 'Partners'];
let suppliers = [];
let filterStatus = null;
let draggedId = null;

// Drag & Drop
function handleDragStart(e) {
  draggedId = e.target.closest('.card').dataset.id;
  e.target.closest('.card').classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function handleDragEnd(e) {
  e.target.closest('.card').classList.remove('dragging');
  document.querySelectorAll('.column-body').forEach(function(el) { el.classList.remove('drag-over'); });
}
function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function handleDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
async function handleDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  var newStatus = e.currentTarget.dataset.status;
  if (!draggedId || !newStatus) return;
  var s = suppliers.find(function(s) { return s.id == draggedId; });
  if (!s || s.status === newStatus) return;
  // Optimistic update
  s.status = newStatus;
  render();
  try {
    await api('PATCH', '/rest/v1/suppliers?id=eq.' + draggedId, { status: newStatus, updated_at: new Date().toISOString() });
    toast('Moved to ' + newStatus);
  } catch(e) {
    toast('Error updating status', true);
    load(); // reload to fix
  }
}

// Load
async function load() {
  try {
    var data = await api('GET', '/rest/v1/suppliers?select=*&order=created_at.desc');
    suppliers = data || [];
  } catch(e) {
    console.error(e);
    suppliers = [];
  }
  render();
}

function render() {
  var q = document.getElementById('search').value.toLowerCase().trim();
  renderStats();
  renderBoard(q);
}

function renderStats() {
  var counts = {};
  STATUSES.forEach(function(s) { counts[s] = 0; });
  var total = 0;
  suppliers.forEach(function(s) { counts[s.status] = (counts[s.status] || 0) + 1; total++; });
  var el = document.getElementById('stats');
  var colors = { all: 'all', Prospects: 'prospects', Contacted: 'contacted', Negotiating: 'negotiating', Sampling: 'sampling', Partners: 'partners' };
  el.innerHTML = '<div class="stat-card all' + (!filterStatus ? ' active' : '') + '" onclick="setFilter(null)"><div class="num">' + total + '</div><div class="label">Total</div></div>' +
    STATUSES.map(function(s) { return '<div class="stat-card ' + colors[s] + (filterStatus === s ? ' active' : '') + '" onclick="setFilter(\'' + s + '\')"><div class="num">' + (counts[s]||0) + '</div><div class="label">' + s + '</div></div>'; }).join('');
}

function setFilter(s) {
  filterStatus = s;
  render();
}

function renderBoard(q) {
  var board = document.getElementById('board');
  board.innerHTML = STATUSES.map(function(status) {
    var items = suppliers.filter(function(s) {
      return s.status === status && (!q || s.company.toLowerCase().includes(q));
    });
    return '<div class="column ' + status.toLowerCase() + '">' +
      '<div class="column-header"><span>' + status + '</span><span class="count">' + items.length + '</span></div>' +
      '<div class="column-body" data-status="' + status + '" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">' +
        items.map(function(s) { return renderCard(s); }).join('') +
      '</div></div>';
  }).join('');
}

function renderCard(s) {
  var notes = s.notes ? s.notes.substring(0, 80) : '';
  var link = s.storefront_link ? '<a href="' + escAttr(s.storefront_link) + '" target="_blank" class="card-link" onclick="event.stopPropagation()">\u279c Alibaba</a>' : '';
  return '<div class="card" draggable="true" data-id="' + s.id + '" ondragstart="handleDragStart(event)" ondragend="handleDragEnd(event)" onclick="openEditModal(\'' + s.id + '\')">' +
    '<div class="card-actions">' +
      '<button class="del-btn" onclick="event.stopPropagation(); deleteSupplier(\'' + s.id + '\',\'' + escAttr(s.company) + '\')">\u2716</button>' +
    '</div>' +
    '<div class="card-company">' + escHtml(s.company) + '</div>' +
    '<div class="card-notes">' + escHtml(notes) + (notes.length >= 80 ? '\u2026' : '') + '</div>' +
    link +
  '</div>';
}

async function deleteSupplier(id, name) {
  if (!confirm('Delete \"' + name + '\"?')) return;
  try {
    await api('DELETE', '/rest/v1/suppliers?id=eq.' + id);
    suppliers = suppliers.filter(function(s) { return s.id != id; });
    render();
    toast('Deleted ' + name);
  } catch(e) {
    toast('Error deleting', true);
  }
}

function openAddModal() {
  document.getElementById('modalTitle').textContent = '+ Add Supplier';
  document.getElementById('editId').value = '';
  document.getElementById('fCompany').value = '';
  document.getElementById('fStorefront').value = '';
  document.getElementById('fStatus').value = 'Prospects';
  document.getElementById('fEmail').value = '';
  document.getElementById('fNotes').value = '';
  document.getElementById('fVerified').checked = false;
  document.getElementById('modal').classList.add('open');
  setTimeout(function() { document.getElementById('fCompany').focus(); }, 100);
}

function openEditModal(id) {
  var s = suppliers.find(function(s) { return s.id == id; });
  if (!s) return;
  document.getElementById('modalTitle').textContent = '\u270f Edit Supplier';
  document.getElementById('editId').value = id;
  document.getElementById('fCompany').value = s.company;
  document.getElementById('fStorefront').value = s.storefront_link || '';
  document.getElementById('fStatus').value = s.status;
  document.getElementById('fEmail').value = s.email || '';
  document.getElementById('fNotes').value = s.notes || '';
  document.getElementById('fVerified').checked = s.verified_pro || false;
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

async function saveSupplier() {
  var company = document.getElementById('fCompany').value.trim();
  if (!company) { toast('Company name is required', true); return; }
  var editId = document.getElementById('editId').value;
  var payload = {
    company: company,
    storefront_link: document.getElementById('fStorefront').value.trim(),
    status: document.getElementById('fStatus').value,
    email: document.getElementById('fEmail').value.trim(),
    notes: document.getElementById('fNotes').value.trim(),
    verified_pro: document.getElementById('fVerified').checked,
    updated_at: new Date().toISOString()
  };
  try {
    if (editId) {
      await api('PATCH', '/rest/v1/suppliers?id=eq.' + editId, payload);
      var idx = suppliers.findIndex(function(s) { return s.id == editId; });
      if (idx >= 0) suppliers[idx] = Object.assign({}, suppliers[idx], payload);
      toast('Updated ' + company);
    } else {
      var data = await api('POST', '/rest/v1/suppliers', payload);
      if (data) suppliers.unshift(data[0]);
      toast('Added ' + company);
    }
    closeModal();
    render();
  } catch(e) {
    toast('Error: ' + e.message, true);
  }
}

function toast(msg, isError) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.style.color = isError ? 'var(--red)' : 'var(--green)';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 2500);
}

function escHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return ('' + s).replace(/&/g,'&amp;').replace(/'/g,'&apos;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

load();
</script>
</body>
</html>
