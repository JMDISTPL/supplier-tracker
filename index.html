<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Supplier Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>\ud83d\udce6</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --border: #2e3348;
    --text: #e4e6f0; --text2: #9498b0; --accent: #6366f1; --accent-hover: #818cf8;
    --green: #22c55e; --yellow: #eab308; --orange: #f97316; --blue: #3b82f6; --red: #ef4444;
    --radius: 10px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  header h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  header .subtitle { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-wrap input {
    width: 100%; padding: 10px 14px 10px 38px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface2); color: var(--text); font-size: 14px; outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap::before {
    content: '\ud83d\udd0d'; position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%); font-size: 14px; opacity: .5;
  }
  .status-filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .status-filters button {
    padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px;
    background: transparent; color: var(--text2); cursor: pointer; font-size: 13px;
  }
  .status-filters button:hover { color: var(--text); border-color: var(--text2); }
  .status-filters button.active { background: var(--accent); border-color: var(--accent); color: white; }
  .btn-primary {
    padding: 10px 20px; background: var(--accent); color: white; border: none;
    border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer;
    white-space: nowrap; display: flex; align-items: center; gap: 6px;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-sm {
    padding: 5px 12px; font-size: 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--text2); cursor: pointer;
  }
  .btn-sm:hover { color: var(--text); border-color: var(--text2); }
  .btn-danger { color: var(--red); }
  .btn-danger:hover { border-color: var(--red); color: var(--red); }
  main { flex: 1; padding: 20px 24px; }
  .stats { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 20px; min-width: 120px;
  }
  .stat-card .num { font-size: 24px; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: var(--text2); margin-top: 2px; text-transform: uppercase; letter-spacing: .5px; }
  .stat-card.all .num { color: var(--text); }
  .stat-card.prospects .num { color: var(--yellow); }
  .stat-card.contacted .num { color: var(--blue); }
  .stat-card.negotiating .num { color: var(--orange); }
  .stat-card.sampling .num { color: var(--accent); }
  .stat-card.partners .num { color: var(--green); }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border);
    color: var(--text2); font-weight: 500; font-size: 12px; text-transform: uppercase;
    letter-spacing: .5px; white-space: nowrap; user-select: none;
  }
  tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }
  tbody td { padding: 12px 16px; vertical-align: middle; }
  .col-company { min-width: 180px; }
  .col-storefront { min-width: 100px; }
  .col-status { min-width: 120px; }
  .col-notes { min-width: 200px; }
  .col-actions { min-width: 80px; text-align: right; }
  .company-name { font-weight: 600; }
  .storefront-link { color: var(--accent); text-decoration: none; font-size: 13px; }
  .storefront-link:hover { text-decoration: underline; }
  .notes-cell { color: var(--text2); font-size: 13px; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
  .badge.Prospects { background: #854d0e20; color: var(--yellow); border: 1px solid #854d0e40; }
  .badge.Contacted { background: #1d4ed820; color: var(--blue); border: 1px solid #1d4ed840; }
  .badge.Negotiating { background: #c2410c20; color: var(--orange); border: 1px solid #c2410c40; }
  .badge.Sampling { background: #4338ca20; color: var(--accent); border: 1px solid #4338ca40; }
  .badge.Partners { background: #15803d20; color: var(--green); border: 1px solid #15803d40; }
  .status-select {
    padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 12px; cursor: pointer;
  }
  .action-btns { display: flex; gap: 4px; justify-content: flex-end; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state h3 { font-size: 18px; color: var(--text); margin-bottom: 6px; }
  .empty-state p { font-size: 14px; max-width: 400px; margin: 0 auto 20px; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 28px;
  }
  .modal h2 { font-size: 18px; margin-bottom: 20px; }
  .modal .close-btn { float: right; background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; }
  .modal .close-btn:hover { color: var(--text); }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 5px; font-weight: 500; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface2); color: var(--text); font-size: 14px; outline: none; font-family: inherit;
  }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .form-actions .btn-secondary {
    padding: 9px 18px; border: 1px solid var(--border); border-radius: var(--radius);
    background: transparent; color: var(--text2); cursor: pointer; font-size: 14px;
  }
  .form-actions .btn-secondary:hover { color: var(--text); border-color: var(--text2); }
  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 20px;
    font-size: 14px; color: var(--green); z-index: 200; display: flex; align-items: center; gap: 8px;
  }
  .loading { text-align: center; padding: 40px; color: var(--text2); }
  .spinner {
    display: inline-block; width: 32px; height: 32px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 768px) {
    header { padding: 12px 16px; }
    header h1 { font-size: 17px; }
    .controls { padding: 12px 16px; flex-direction: column; }
    .search-wrap { width: 100%; }
    .status-filters { width: 100%; justify-content: center; }
    main { padding: 12px 16px; }
    .stats { gap: 8px; }
    .stat-card { padding: 10px 14px; min-width: 80px; flex: 1; }
    .stat-card .num { font-size: 18px; }
    table { font-size: 13px; }
    thead th, tbody td { padding: 8px 10px; }
    .col-notes { display: none; }
    .modal { padding: 20px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>&#x1f4e6; Supplier Tracker</h1>
    <div class="subtitle">Amazon PL &mdash; supplier pipeline dashboard</div>
  </div>
  <button class="btn-primary" onclick="openAddModal()">&#x2795; Add Supplier</button>
</header>

<div class="controls">
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search suppliers..." oninput="render()" />
  </div>
  <div class="status-filters" id="statusFilters"></div>
</div>

<main>
  <div class="stats" id="stats"></div>
  <div id="tableContainer">
    <div class="loading"><div class="spinner"></div><div>Loading suppliers...</div></div>
  </div>
</main>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">&cross;</button>
    <h2 id="modalTitle">&#x2795; Add Supplier</h2>
    <input type="hidden" id="editId" />
    <div class="form-group">
      <label>Company Name *</label>
      <input type="text" id="fCompany" placeholder="e.g. Yiwu Lucky Star Crafts" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Storefront Link</label>
        <input type="text" id="fStorefront" placeholder="Alibaba URL" />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="fStatus">
          <option value="Prospects">Prospects</option>
          <option value="Contacted">Contacted</option>
          <option value="Negotiating">Negotiating</option>
          <option value="Sampling">Sampling</option>
          <option value="Partners">Partners</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="fEmail" placeholder="supplier@example.com" />
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="fNotes" placeholder="Products, MOQ, pricing, business type, etc."></textarea>
    </div>
    <div class="form-group">
      <label><input type="checkbox" id="fVerified" /> Verified Pro supplier</label>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveSupplier()">&#x1f4be; Save</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://yybpjnxudjptlnuswskt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5YnBqbnh1ZGpwdGxudXN3c2t0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2OTA0OTksImV4cCI6MjA5NjI2NjQ5OX0.dOBkm1KT1X9xoXozd7yqpxfs9_8Tvv3E7RW-W-8opRQ';

async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json'
    }
  };
  if (body) {
    opts.headers['Prefer'] = 'return=representation';
    opts.body = JSON.stringify(body);
  }
  const resp = await fetch(SUPABASE_URL + path, opts);
  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(errText.substring(0, 100));
  }
  const ct = resp.headers.get('content-type') || '';
  if (ct.includes('json')) return resp.json();
  return null;
}

const STATUSES = ['Prospects', 'Contacted', 'Negotiating', 'Sampling', 'Partners'];
let suppliers = [];
let filterStatus = null;

const filtersEl = document.getElementById('statusFilters');
filtersEl.innerHTML = '<button class="active" data-status="" onclick="setFilter(null)">All</button>' +
  STATUSES.map(s => '<button data-status="' + s + '" onclick="setFilter(\'' + s + '\')">' + s + '</button>').join('');

function setFilter(s) {
  filterStatus = s;
  document.querySelectorAll('#statusFilters button').forEach(function(b) {
    b.classList.toggle('active', b.dataset.status === (s || ''));
  });
  render();
}

async function load() {
  try {
    const data = await api('GET', '/rest/v1/suppliers?select=*&order=created_at.desc');
    suppliers = data || [];
  } catch(e) {
    console.error('Load error:', e);
    suppliers = [];
  }
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  var filtered = suppliers;
  if (q) filtered = filtered.filter(function(s) { return s.company.toLowerCase().includes(q); });
  if (filterStatus) filtered = filtered.filter(function(s) { return s.status === filterStatus; });
  renderStats();
  renderTable(filtered);
}

function renderStats() {
  var counts = {};
  STATUSES.forEach(function(s) { counts[s] = 0; });
  var total = 0;
  suppliers.forEach(function(s) { counts[s.status] = (counts[s.status] || 0) + 1; total++; });
  
  const el = document.getElementById('stats');
  const colors = { Prospects: 'prospects', Contacted: 'contacted', Negotiating: 'negotiating', Sampling: 'sampling', Partners: 'partners' };
  el.innerHTML = '<div class="stat-card all"><div class="num">' + total + '</div><div class="label">Total</div></div>' +
    STATUSES.map(function(s) { return '<div class="stat-card ' + colors[s] + '"><div class="num">' + (counts[s]||0) + '</div><div class="label">' + s + '</div></div>'; }).join('');
}

function renderTable(data) {
  const container = document.getElementById('tableContainer');
  if (!data.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">&#x1f4ed;</div><h3>No suppliers found</h3><p>' + (filterStatus ? 'No suppliers with this status.' : 'Add your first supplier to get started!') + '</p>' + (!filterStatus ? '<button class="btn-primary" onclick="openAddModal()">&#x2795; Add Your First Supplier</button>' : '') + '</div>';
    return;
  }
  container.innerHTML = '<div class="table-wrap"><table><thead><tr><th>Company</th><th>Storefront</th><th>Status</th><th class="col-notes">Notes</th><th></th></tr></thead><tbody>' + data.map(function(s) { return renderRow(s); }).join('') + '</tbody></table></div>';
}

function renderRow(s) {
  const notes = s.notes ? s.notes.substring(0, 100) + (s.notes.length > 100 ? '\u2026' : '') : '';
  const storeLink = s.storefront_link ? '<a href="' + escHtml(s.storefront_link) + '" target="_blank" class="storefront-link" onclick="event.stopPropagation()">\ud83d\udd17 Alibaba</a>' : '<span style="color:var(--text2);font-size:12px">\u2014</span>';
  return '<tr onclick="openEditModal(\'' + s.id + '\')">' +
    '<td class="col-company"><span class="company-name">' + escHtml(s.company) + '</span></td>' +
    '<td class="col-storefront">' + storeLink + '</td>' +
    '<td class="col-status">' +
      '<select class="status-select" data-id="' + s.id + '" value="' + s.status + '" onchange="updateStatus(\'' + s.id + '\', this.value); event.stopPropagation();">' +
        STATUSES.map(function(st) { return '<option value="' + st + '"' + (st===s.status?' selected':'') + '>' + st + '</option>'; }).join('') +
      '</select></td>' +
    '<td class="col-notes notes-cell">' + (notes ? escHtml(notes) : '<span style="color:var(--text2);font-size:12px">\u2014</span>') + '</td>' +
    '<td class="col-actions"><div class="action-btns"><button class="btn-sm btn-danger" onclick="deleteSupplier(\'' + s.id + '\',\'' + escHtml(s.company) + '\'); event.stopPropagation();">&#x1f5d1;</button></div></td>' +
  '</tr>';
}

async function updateStatus(id, newStatus) {
  try {
    await api('PATCH', '/rest/v1/suppliers?id=eq.' + id, { status: newStatus, updated_at: new Date().toISOString() });
    const s = suppliers.find(function(s) { return s.id == id; });
    if (s) s.status = newStatus;
    toast('Status updated to ' + newStatus);
  } catch(e) {
    toast('Error updating status', true);
  }
}

async function deleteSupplier(id, name) {
  if (!confirm('Delete "' + name + '"?')) return;
  try {
    await api('DELETE', '/rest/v1/suppliers?id=eq.' + id);
    suppliers = suppliers.filter(function(s) { return s.id != id; });
    render();
    toast('Deleted ' + name);
  } catch(e) {
    toast('Error deleting', true);
  }
}

function openAddModal() {
  document.getElementById('modalTitle').textContent = '\u2795 Add Supplier';
  document.getElementById('editId').value = '';
  document.getElementById('fCompany').value = '';
  document.getElementById('fStorefront').value = '';
  document.getElementById('fStatus').value = 'Prospects';
  document.getElementById('fEmail').value = '';
  document.getElementById('fNotes').value = '';
  document.getElementById('fVerified').checked = false;
  document.getElementById('modal').classList.add('open');
  setTimeout(function() { document.getElementById('fCompany').focus(); }, 100);
}

function openEditModal(id) {
  const s = suppliers.find(function(s) { return s.id == id; });
  if (!s) return;
  document.getElementById('modalTitle').textContent = '\u270f Edit Supplier';
  document.getElementById('editId').value = id;
  document.getElementById('fCompany').value = s.company;
  document.getElementById('fStorefront').value = s.storefront_link || '';
  document.getElementById('fStatus').value = s.status;
  document.getElementById('fEmail').value = s.email || '';
  document.getElementById('fNotes').value = s.notes || '';
  document.getElementById('fVerified').checked = s.verified_pro || false;
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

async function saveSupplier() {
  const company = document.getElementById('fCompany').value.trim();
  if (!company) { toast('Company name is required', true); return; }
  const editId = document.getElementById('editId').value;
  const payload = {
    company: company,
    storefront_link: document.getElementById('fStorefront').value.trim(),
    status: document.getElementById('fStatus').value,
    email: document.getElementById('fEmail').value.trim(),
    notes: document.getElementById('fNotes').value.trim(),
    verified_pro: document.getElementById('fVerified').checked,
    updated_at: new Date().toISOString()
  };

  try {
    if (editId) {
      await api('PATCH', '/rest/v1/suppliers?id=eq.' + editId, payload);
      var idx = suppliers.findIndex(function(s) { return s.id == editId; });
      if (idx >= 0) suppliers[idx] = Object.assign({}, suppliers[idx], payload);
      toast('Updated ' + company);
    } else {
      var data = await api('POST', '/rest/v1/suppliers', payload);
      if (data) suppliers.unshift(data[0]);
      toast('Added ' + company);
    }
    closeModal();
    render();
  } catch(e) {
    toast('Error: ' + e.message, true);
  }
}

function toast(msg, isError) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.style.color = isError ? 'var(--red)' : 'var(--green)';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 2500);
}

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

load();
</script>
</body>
</html>
