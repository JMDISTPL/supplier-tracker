<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JMPL Logistics</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --border: #2e3348;
    --text: #e4e6f0; --text2: #9498b0; --accent: #6366f1; --accent-hover: #818cf8;
    --green: #22c55e; --yellow: #eab308; --orange: #f97316; --blue: #3b82f6; --red: #ef4444;
    --radius: 10px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }

  /* ===== LEFT SIDEBAR NAV ===== */
  .side-nav {
    width: 72px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border); display: flex;
    flex-direction: column; align-items: center; padding: 16px 0;
    position: sticky; top: 0; height: 100vh;
  }
  .side-nav .logo {
    font-size: 24px; margin-bottom: 24px; cursor: default;
  }
  .side-nav a {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 12px 8px; margin: 2px 0; border-radius: 10px;
    color: var(--text2); text-decoration: none; cursor: pointer;
    transition: all .15s; font-size: 11px; width: 56px;
  }
  .side-nav a:hover { color: var(--text); background: var(--surface2); }
  .side-nav a.active { color: var(--accent); background: var(--surface2); }
  .side-nav a .nav-icon { font-size: 20px; }

  /* ===== MAIN ===== */
  .main-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* Top bar */
  .top-bar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center;
    justify-content: space-between; flex-shrink: 0;
  }
  .top-bar h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .top-bar .subtitle { font-size: 12px; color: var(--text2); }

  /* Pages */
  .page { display: none; flex-direction: column; flex: 1; }
  .page.active { display: flex; }

  /* ===== SUPPLIER PAGE ===== */
  .controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .search-wrap { flex: 1; min-width: 180px; position: relative; display: flex; align-items: center; }
  .search-icon { position: absolute; left: 12px; font-size: 14px; opacity: .5; pointer-events: none; }
  .search-wrap input {
    width: 100%; padding: 8px 12px 8px 34px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface2); color: var(--text); font-size: 13px; outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); }

  .stats { display: flex; gap: 8px; padding: 12px 24px; flex-wrap: wrap; flex-shrink: 0; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 14px; min-width: 80px; flex: 1;
    cursor: pointer; transition: border-color .15s;
  }
  .stat-card:hover { border-color: var(--text2); }
  .stat-card.active { border-color: var(--accent); }
  .stat-card .num { font-size: 20px; font-weight: 700; }
  .stat-card .label { font-size: 10px; color: var(--text2); margin-top: 1px; text-transform: uppercase; letter-spacing: .5px; }
  .stat-card.all .num { color: var(--text); }
  .stat-card.prospects .num { color: var(--yellow); }
  .stat-card.contacted .num { color: var(--blue); }
  .stat-card.negotiating .num { color: var(--orange); }
  .stat-card.sampling .num { color: var(--accent); }
  .stat-card.partners .num { color: var(--green); }

  .board { display: flex; gap: 10px; padding: 0 24px 16px; flex: 1; overflow-x: auto; }
  .column {
    flex: 1; min-width: 180px; max-width: 260px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; max-height: calc(100vh - 200px);
  }
  .column-header {
    padding: 8px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
    border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; flex-shrink: 0;
  }
  .column-header .count { background: var(--surface2); padding: 1px 7px; border-radius: 10px; font-size: 10px; }
  .column-body { padding: 6px; overflow-y: auto; flex: 1; min-height: 40px; transition: background .15s; }
  .column-body.drag-over { background: var(--surface2); }
  .column.prospects .column-header { color: var(--yellow); }
  .column.contacted .column-header { color: var(--blue); }
  .column.negotiating .column-header { color: var(--orange); }
  .column.sampling .column-header { color: var(--accent); }
  .column.partners .column-header { color: var(--green); }

  .card {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 9px; margin-bottom: 4px; cursor: grab; transition: all .15s; position: relative;
  }
  .card:active { cursor: grabbing; }
  .card:hover { border-color: var(--text2); }
  .card.dragging { opacity: .5; transform: rotate(2deg); }
  .card .card-company { font-weight: 600; font-size: 12px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .card-notes { font-size: 10px; color: var(--text2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card .card-link { font-size: 10px; color: var(--accent); text-decoration: none; }
  .card .card-actions { position: absolute; top: 4px; right: 4px; display: none; }
  .card:hover .card-actions { display: block; }
  .card .card-actions button { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 11px; padding: 2px; border-radius: 4px; }
  .card .card-actions button:hover { background: var(--surface); color: var(--red); }

  .btn {
    padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: none; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-hover); }

  /* ===== BRIEFS PAGE ===== */
  .briefs-layout { display: flex; flex: 1; overflow: hidden; }
  .briefs-sidebar {
    width: 200px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border); overflow-y: auto; padding: 12px;
  }
  .briefs-sidebar h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--text2); margin-bottom: 8px; padding: 0 4px;
  }
  .briefs-sidebar .brief-list-item {
    padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 12px;
    color: var(--text2); transition: all .1s; margin-bottom: 2px;
  }
  .briefs-sidebar .brief-list-item:hover { background: var(--surface2); color: var(--text); }
  .briefs-sidebar .brief-list-item.active { background: var(--accent); color: white; }
  .briefs-sidebar .brief-list-item .date-label { font-weight: 600; }
  .briefs-sidebar .brief-list-item .title-preview { font-size: 10px; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Chat-style brief display */
  .briefs-chat {
    flex: 1; overflow-y: auto; padding: 24px 32px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .brief-entry {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px 24px; max-width: 720px;
    align-self: flex-start; width: 100%;
  }
  .brief-entry .brief-date-header {
    font-size: 13px; font-weight: 600; color: var(--accent);
    margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .brief-entry .brief-date-header .title { color: var(--text); font-size: 15px; }
  .brief-entry .section-block { margin-bottom: 14px; }
  .brief-entry .section-block:last-child { margin-bottom: 0; }
  .brief-entry .section-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .5px; color: var(--text2); margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .brief-entry .section-content {
    font-size: 13px; line-height: 1.6; color: var(--text);
    white-space: pre-wrap;
  }
  .brief-empty {
    text-align: center; padding: 60px 20px; color: var(--text2);
  }
  .brief-empty .icon { font-size: 40px; margin-bottom: 10px; }
  .brief-empty h3 { font-size: 16px; color: var(--text); margin-bottom: 4px; }
  .brief-empty p { font-size: 13px; max-width: 400px; margin: 0 auto; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 24px;
  }
  .modal h2 { font-size: 17px; margin-bottom: 16px; }
  .modal .close-btn { float: right; background: none; border: none; color: var(--text2); font-size: 18px; cursor: pointer; }
  .modal .close-btn:hover { color: var(--text); }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; font-weight: 500; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface2); color: var(--text); font-size: 13px; outline: none; font-family: inherit;
  }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .btn-secondary {
    padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px;
    background: transparent; color: var(--text2); cursor: pointer; font-size: 13px;
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--text2); }
  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 18px;
    font-size: 13px; color: var(--green); z-index: 200;
  }
  .loading { text-align: center; padding: 40px; color: var(--text2); }
  .spinner { display: inline-block; width: 24px; height: 24px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    .side-nav { width: 56px; }
    .side-nav a { width: 44px; padding: 8px 4px; font-size: 10px; }
    .side-nav a .nav-icon { font-size: 16px; }
    .board { flex-direction: column; overflow-y: auto; }
    .column { max-width: none; min-width: 0; max-height: none; }
    .column-body { max-height: 160px; }
    .briefs-layout { flex-direction: column; }
    .briefs-sidebar { width: 100%; max-height: 120px; border-right: none; border-bottom: 1px solid var(--border); }
    .briefs-chat { padding: 12px 16px; }
    .brief-entry { padding: 14px 16px; }
  }
</style>
</head>
<body>

<!-- ===== LEFT NAV ===== -->
<nav class="side-nav">
  <div class="logo">📦</div>
  <a href="#suppliers" class="active" onclick="switchPage('suppliers')">
    <span class="nav-icon">📋</span>
    <span>Suppliers</span>
  </a>
  <a href="#briefs" onclick="switchPage('briefs')">
    <span class="nav-icon">📝</span>
    <span>Briefs</span>
  </a>
</nav>

<!-- ===== MAIN ===== -->
<div class="main-area">

<div class="top-bar">
  <div>
    <h1>📦 JMPL Logistics</h1>
    <div class="subtitle">Amazon PL operations dashboard</div>
  </div>
  <button class="btn btn-primary" onclick="openAddModal()" id="addBtn" style="display:none">+ Add Supplier</button>
</div>

<!-- SUPPLIER PAGE -->
<div id="page-suppliers" class="page active">
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Filter suppliers..." oninput="renderSuppliers()" />
    </div>
    <button class="btn btn-primary" onclick="openAddModal()">+ Add Supplier</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="board" id="board"></div>
</div>

<!-- BRIEFS PAGE -->
<div id="page-briefs" class="page">
  <div class="briefs-layout">
    <div class="briefs-sidebar">
      <h3>📅 Daily Briefs</h3>
      <div id="briefList"></div>
    </div>
    <div class="briefs-chat" id="briefChat">
      <div class="loading"><div class="spinner"></div><div>Loading briefs...</div></div>
    </div>
  </div>
</div>

</div>

<!-- Supplier Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">&cross;</button>
    <h2 id="modalTitle">+ Add Supplier</h2>
    <input type="hidden" id="editId" />
    <div class="form-group"><label>Company Name *</label><input type="text" id="fCompany" placeholder="e.g. Yiwu Lucky Star Crafts" /></div>
    <div class="form-row">
      <div class="form-group"><label>Storefront Link</label><input type="text" id="fStorefront" placeholder="Alibaba URL" /></div>
      <div class="form-group"><label>Status</label>
        <select id="fStatus">
          <option value="Prospects">Prospects</option>
          <option value="Contacted">Contacted</option>
          <option value="Negotiating">Negotiating</option>
          <option value="Sampling">Sampling</option>
          <option value="Partners">Partners</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label>Email</label><input type="email" id="fEmail" placeholder="supplier@example.com" /></div>
    <div class="form-group"><label>Notes</label><textarea id="fNotes" placeholder="Products, MOQ, pricing, business type, etc."></textarea></div>
    <div class="form-group"><label><input type="checkbox" id="fVerified" /> Verified Pro supplier</label></div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSupplier()">Save</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://yybpjnxudjptlnuswskt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5YnBqbnh1ZGpwdGxudXN3c2t0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2OTA0OTksImV4cCI6MjA5NjI2NjQ5OX0.dOBkm1KT1X9xoXozd7yqpxfs9_8Tvv3E7RW-W-8opRQ';

async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json'
    }
  };
  if (body) { opts.headers['Prefer'] = 'return=representation'; opts.body = JSON.stringify(body); }
  const resp = await fetch(SUPABASE_URL + path, opts);
  if (!resp.ok) throw new Error((await resp.text()).substring(0, 100));
  return (resp.headers.get('content-type')||'').includes('json') ? resp.json() : null;
}

// ===== PAGE ROUTING =====
function switchPage(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.side-nav a').forEach(function(a) { a.classList.remove('active'); });
  document.querySelector('.side-nav a[href="#' + name + '"]').classList.add('active');
  document.getElementById('addBtn').style.display = name === 'suppliers' ? '' : 'none';
  window.location.hash = name;
  if (name === 'briefs') loadBriefs();
}

switchPage(window.location.hash ? window.location.hash.substring(1) : 'suppliers');

// ============================================================
// SUPPLIERS
// ============================================================
const STATUSES = ['Prospects', 'Contacted', 'Negotiating', 'Sampling', 'Partners'];
let suppliers = [];
let filterStatus = null;
let draggedId = null;

function hDS(e) { draggedId = e.target.closest('.card').dataset.id; e.target.closest('.card').classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
function hDE(e) { e.target.closest('.card').classList.remove('dragging'); document.querySelectorAll('.column-body').forEach(function(el) { el.classList.remove('drag-over'); }); }
function hDO(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; e.currentTarget.classList.add('drag-over'); }
function hDL(e) { e.currentTarget.classList.remove('drag-over'); }
async function hDrop(e) {
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  var ns = e.currentTarget.dataset.status; if (!draggedId||!ns) return;
  var s = suppliers.find(function(s) { return s.id == draggedId; }); if (!s||s.status===ns) return;
  s.status = ns; renderSuppliers();
  try { await api('PATCH','/rest/v1/suppliers?id=eq.'+draggedId,{status:ns,updated_at:new Date().toISOString()}); toast('Moved to '+ns); }
  catch(e) { toast('Error',true); loadSuppliers(); }
}

async function loadSuppliers() {
  try { suppliers = (await api('GET','/rest/v1/suppliers?select=*&order=created_at.desc'))||[]; } catch(e) { suppliers=[]; }
  renderSuppliers();
}

function renderSuppliers() {
  var q = document.getElementById('search').value.toLowerCase().trim();
  renderStats();
  document.getElementById('board').innerHTML = STATUSES.map(function(st) {
    var items = suppliers.filter(function(s) { return s.status===st && (!q||s.company.toLowerCase().includes(q)); });
    return '<div class="column '+st.toLowerCase()+'"><div class="column-header"><span>'+st+'</span><span class="count">'+items.length+'</span></div><div class="column-body" data-status="'+st+'" ondrop="hDrop(event)" ondragover="hDO(event)" ondragleave="hDL(event)">'+items.map(function(s){return renderCard(s);}).join('')+'</div></div>';
  }).join('');
}

function renderCard(s) {
  var n = s.notes ? s.notes.substring(0,70) : '';
  var l = s.storefront_link ? '<a href="'+escA(s.storefront_link)+'" target="_blank" class="card-link" onclick="event.stopPropagation()">\u279c Alibaba</a>' : '';
  return '<div class="card" draggable="true" data-id="'+s.id+'" ondragstart="hDS(event)" ondragend="hDE(event)" onclick="openEditModal(\''+s.id+'\')"><div class="card-actions"><button onclick="event.stopPropagation();deleteSupplier(\''+s.id+'\',\''+escA(s.company)+'\')">\u2716</button></div><div class="card-company">'+escHtml(s.company)+'</div><div class="card-notes">'+escHtml(n)+(n.length>=70?'\u2026':'')+'</div>'+l+'</div>';
}

function renderStats() {
  var c={}; STATUSES.forEach(function(s){c[s]=0;}); var t=0; suppliers.forEach(function(s){c[s.status]=(c[s.status]||0)+1;t++;});
  document.getElementById('stats').innerHTML = '<div class="stat-card all'+(filterStatus?'':' active')+'" onclick="setF(null)"><div class="num">'+t+'</div><div class="label">Total</div></div>'+STATUSES.map(function(s){return '<div class="stat-card '+s.toLowerCase()+(filterStatus===s?' active':'')+'" onclick="setF(\''+s+'\')"><div class="num">'+(c[s]||0)+'</div><div class="label">'+s+'</div></div>';}).join('');
}

function setF(s) { filterStatus=s; renderSuppliers(); }

async function deleteSupplier(id,n) { if(!confirm('Delete "'+n+'"?')) return; try{await api('DELETE','/rest/v1/suppliers?id=eq.'+id); suppliers=suppliers.filter(function(s){return s.id!=id;}); renderSuppliers(); toast('Deleted '+n);}catch(e){toast('Error',true);} }

function openAddModal() {
  document.getElementById('modalTitle').textContent='+ Add Supplier'; document.getElementById('editId').value='';
  ['fCompany','fStorefront','fEmail','fNotes'].forEach(function(i){document.getElementById(i).value='';});
  document.getElementById('fStatus').value='Prospects'; document.getElementById('fVerified').checked=false;
  document.getElementById('modal').classList.add('open'); setTimeout(function(){document.getElementById('fCompany').focus();},100);
}
function openEditModal(id) {
  var s=suppliers.find(function(s){return s.id==id;}); if(!s) return;
  document.getElementById('modalTitle').textContent='\u270f Edit Supplier'; document.getElementById('editId').value=id;
  document.getElementById('fCompany').value=s.company; document.getElementById('fStorefront').value=s.storefront_link||'';
  document.getElementById('fStatus').value=s.status; document.getElementById('fEmail').value=s.email||'';
  document.getElementById('fNotes').value=s.notes||''; document.getElementById('fVerified').checked=s.verified_pro||false;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
async function saveSupplier() {
  var co=document.getElementById('fCompany').value.trim(); if(!co){toast('Company name required',true);return;}
  var eid=document.getElementById('editId').value;
  var p={company:co,storefront_link:document.getElementById('fStorefront').value.trim(),status:document.getElementById('fStatus').value,email:document.getElementById('fEmail').value.trim(),notes:document.getElementById('fNotes').value.trim(),verified_pro:document.getElementById('fVerified').checked,updated_at:new Date().toISOString()};
  try{if(eid){await api('PATCH','/rest/v1/suppliers?id=eq.'+eid,p);var idx=suppliers.findIndex(function(s){return s.id==eid;});if(idx>=0)suppliers[idx]=Object.assign({},suppliers[idx],p);toast('Updated '+co);}else{var d=await api('POST','/rest/v1/suppliers',p);if(d)suppliers.unshift(d[0]);toast('Added '+co);}closeModal();renderSuppliers();}catch(e){toast('Error: '+e.message,true);}
}

// ============================================================
// BRIEFS — Read-only chat format
// ============================================================
let briefs = [];
let currentBriefId = null;

async function loadBriefs() {
  try { briefs = (await api('GET','/rest/v1/daily_briefs?select=*&order=brief_date.desc'))||[]; } catch(e) { briefs=[]; }
  renderBriefList();
  if (currentBriefId) renderBriefChat(currentBriefId);
  else if (briefs.length) renderBriefChat(briefs[0].id);
  else renderEmptyChat();
}

function renderBriefList() {
  document.getElementById('briefList').innerHTML = briefs.map(function(b) {
    var t = b.title||'(untitled)';
    return '<div class="brief-list-item'+(b.id==currentBriefId?' active':'')+'" onclick="renderBriefChat('+b.id+')"><div class="date-label">'+b.brief_date+'</div><div class="title-preview">'+escHtml(t)+'</div></div>';
  }).join('');
}

function renderEmptyChat() {
  document.getElementById('briefChat').innerHTML = '<div class="brief-empty"><div class="icon">📭</div><h3>No briefs yet</h3><p>Daily briefs will appear here once the cron job is set up.</p></div>';
}

function renderBriefChat(id) {
  var b = briefs.find(function(b){return b.id==id;}); if(!b) { renderEmptyChat(); return; }
  currentBriefId = b.id; renderBriefList();
  
  var dateStr = b.brief_date;
  var parts = dateStr.split('-');
  var d = new Date(parts[0], parts[1]-1, parts[2]);
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var formatted = dayNames[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();

  var content = b.notes || '';
  content = content.replace(/\[color\]D([+-][0-9.]+%)/g, function(m,p) {
    var clr = p.startsWith('+') ? 'var(--green)' : 'var(--red)';
    var emoji = p.startsWith('+') ? '\ud83d\udfe2' : '\ud83d\udd34';
    return emoji + '<span style="color:'+clr+';font-weight:600">D' + p + '</span>';
  });
  content = content.replace(/\[color\]W([+-][0-9.]+%)/g, function(m,p) {
    var clr = p.startsWith('+') ? 'var(--green)' : 'var(--red)';
    var emoji = p.startsWith('+') ? '\ud83d\udfe2' : '\ud83d\udd34';
    return emoji + '<span style="color:'+clr+';font-weight:600">W' + p + '</span>';
  });
  content = content.replace(/\[color\]M([+-][0-9.]+%)/g, function(m,p) {
    var clr = p.startsWith('+') ? 'var(--green)' : 'var(--red)';
    var emoji = p.startsWith('+') ? '\ud83d\udfe2' : '\ud83d\udd34';
    return emoji + '<span style="color:'+clr+';font-weight:600">M' + p + '</span>';
  });

  content = content.split('\n').map(function(line) {
    if (line.startsWith('Good morning') || line.startsWith('Good')) {
      return '<div style="font-size:16px;font-weight:600;margin-bottom:12px">' + escHtml(line) + '</div>';
    }
    if (line.startsWith('\ud83d\udcaa') || line.startsWith('\ud83d\udcd6') || line.startsWith('\ud83d\udcac') || line.startsWith('\ud83d\udcca') || line.startsWith('\ud83d\udcf0') || line.startsWith('\ud83c\udf0d')) {
      return '<div style="font-size:13px;font-weight:700;color:var(--accent);margin-top:16px;margin-bottom:6px">' + escHtml(line) + '</div>';
    }
    if (line.startsWith('\u2022')) {
      return '<div style="margin-bottom:3px;padding-left:8px">' + escHtml(line) + '</div>';
    }
    if (line.trim() === '') return '';
    return '<div style="margin-bottom:2px">' + escHtml(line) + '</div>';
  }).join('');

  document.getElementById('briefChat').innerHTML =
    '<div class="brief-entry"><div class="brief-date-header"><span class="title">' + escHtml(b.title||'Daily Brief') + '</span><span>' + formatted + '</span></div>' +
    '<div style="line-height:1.7">' + content + '</div></div>';
}

// ===== UTILS =====
function toast(m,e){var t=document.createElement('div');t.className='toast';t.style.color=e?'var(--red)':'var(--green)';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2500);}
function escHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function escA(s){return (''+s).replace(/&/g,'&amp;').replace(/'/g,'&apos;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

loadSuppliers();
</script>
